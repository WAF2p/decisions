    }
  ]
};

    const grid = document.getElementById('grid');
    const stats = document.getElementById('stats');
    const kindFilter = document.getElementById('kindFilter');
    const statusFilter = document.getElementById('statusFilter');
    const repoFilter = document.getElementById('repoFilter');
    const catFilter = document.getElementById('catFilter');
    const search = document.getElementById('search');

    const records = registry.records || [];

    const unique = key => [...new Set(records.map(r => r[key]).filter(Boolean).flat())].sort();
    const uniqueSingle = key => [...new Set(records.map(r => r[key]).filter(Boolean))].sort();

    function fill(select, values) {
      const cur = select.value;
      select.innerHTML = '<option value="">All</option>' + values.map(v => `<option value="${v}">${v}</option>`).join('');
      select.value = cur;
    }

    fill(kindFilter, uniqueSingle('kind'));
    fill(statusFilter, uniqueSingle('status'));
    fill(repoFilter, unique('repo'));
    fill(catFilter, uniqueSingle('category'));

    function repoUrl(slug) {
      const r = (registry.repositories || []).find(x => x.slug === slug);
      return r ? r.url : `https://github.com/WAF2p/${slug}`;
    }

    function render() {
      const q = search.value.toLowerCase();
      const filtered = records.filter(r => {
        const text = [r.id, r.title_en, r.title_de, r.summary_en, r.summary_de, (r.tags || []).join(' ')].join(' ').toLowerCase();
        const inRepo = !repoFilter.value || (r.repo === repoFilter.value) || ((r.repos || []).includes(repoFilter.value));
        return (!kindFilter.value || r.kind === kindFilter.value) &&
               (!statusFilter.value || r.status === statusFilter.value) &&
               inRepo &&
               (!catFilter.value || r.category === catFilter.value) &&
               (!q || text.includes(q));
      });

      const counts = {};
      records.forEach(r => { counts[r.kind] = (counts[r.kind] || 0) + 1; });
      const statusCounts = {};
      records.forEach(r => { statusCounts[r.status] = (statusCounts[r.status] || 0) + 1; });

      stats.innerHTML = `
        <div class="stat"><div class="num">${records.length}</div><div class="label">Total records</div></div>
        <div class="stat"><div class="num">${counts.adr || 0}</div><div class="label">ADRs</div></div>
        <div class="stat"><div class="num">${counts.rfc || 0}</div><div class="label">RFCs</div></div>
        <div class="stat"><div class="num">${statusCounts.implemented || 0}</div><div class="label">Implemented</div></div>
        <div class="stat"><div class="num">${(statusCounts.open || 0) + (statusCounts.draft || 0)}</div><div class="label">Open / Draft</div></div>
      `;

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty">No records match the current filters.</div>';
        return;
      }

      grid.innerHTML = filtered.map(r => {
        const title = r.title_en || r.title;
        const summary = r.summary_en || r.summary;
        const statusClass = r.status;
        const fileUrl = `https://github.com/WAF2p/decisions/blob/main/${r.path}`;
        const discussion = r.discussion || r.source_url;
        const repoName = r.repo || (r.repos && r.repos[0]);
        const repoLink = repoName ? `<a href="${repoUrl(repoName)}" target="_blank" rel="noopener">${repoName}</a>` : '';
        return `
          <article class="card">
            <div class="row">
              <span class="id">${r.id}</span>
              <span class="status ${statusClass}">${r.status}</span>
            </div>
            <h3 class="title">${title}</h3>
            <p class="summary">${summary || ''}</p>
            <div class="meta">
              <span>${r.kind.toUpperCase()}</span>
              ${(r.tags || []).map(t => `<span>#${t}</span>`).join('')}
              ${r.category ? `<span>${r.category}</span>` : ''}
              ${r.date ? `<span>${r.date}</span>` : (r.opened ? `<span>${r.opened}</span>` : '')}
              ${repoName ? `<span>${repoLink}</span>` : ''}
            </div>
            <div class="links">
              <a href="${fileUrl}" target="_blank" rel="noopener">View record →</a>
              ${discussion ? `<a href="${discussion}" target="_blank" rel="noopener">Discussion →</a>` : ''}
            </div>
          </article>
        `;
      }).join('');
    }

    [kindFilter, statusFilter, repoFilter, catFilter, search].forEach(el => el.addEventListener('input', render));
    render();
  </script>
</body>
</html>
